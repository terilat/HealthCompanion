services:
  health-companion:
    build:
      context: .
      dockerfile: Dockerfile
    image: health-companion:latest
    working_dir: /app
    volumes:
      - .:/app
      - ${DATA_DIR:-./data}:/app/data
      - ${LOG_DIR:-./logs}:/app/logs
    env_file:
      - .env
    command: python run_bot.py
    restart: unless-stopped
    network_mode: host
