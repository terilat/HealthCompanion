name: deploy-dev

on:
  push:
    branches: ["dev"]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, terilat-MS-7E27]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env from secrets (if provided)
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          set -euo pipefail
          printf 'TELEGRAM_BOT_TOKEN=%s\n' "${TELEGRAM_BOT_TOKEN}" > .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Build and run via Compose
        run: |
          set -euo pipefail
          docker compose build
          docker compose up -d --remove-orphans
