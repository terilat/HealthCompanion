name: deploy-dev

on:
  push:
    branches: ["dev"]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Test workflow
    runs-on: [self-hosted, terilat-MS-7E27]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Ensure local .env exists
        run: |
          set -euo pipefail
          if [ ! -f .env ]; then
            echo "Missing .env in workspace. Create it on the runner before deploy."
            exit 1
          fi

      - name: Build and run via Compose
        run: |
          set -euo pipefail
          docker compose up -d --build --remove-orphans

      - name: Cleanup old containers/images
        run: |
          set -euo pipefail
          docker container prune -f
          docker image prune -f
