name: deploy-dev

on:
  push:
    branches: ["dev"]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Write .env from secrets
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN secret. Add it in GitHub: Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "${DATA_DIR_DOCKER}" ] || [ -z "${LOG_DIR_DOCKER}" ]; then
            echo "Missing DATA_DIR_DOCKER or LOG_DIR_DOCKER variables. Add them in GitHub: Settings -> Secrets and variables -> Actions (Variables)."
            exit 1
          fi
          printf 'TELEGRAM_BOT_TOKEN=%s\nDATA_DIR_DOCKER=%s\nLOG_DIR_DOCKER=%s\n' \
            "${TELEGRAM_BOT_TOKEN}" "${DATA_DIR}" "${LOG_DIR}" > .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DATA_DIR: ${{ vars.DATA_DIR }}
          LOG_DIR: ${{ vars.LOG_DIR }}

      - name: Build and run via Compose
        run: |
          set -euo pipefail
          docker compose up -d --build --remove-orphans

      - name: Cleanup old containers/images
        run: |
          set -euo pipefail
          docker container prune -f
          docker image prune -f
