name: deploy-dev

on:
  push:
    branches: ["dev"]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Test workflow
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Write .env from secrets
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN secret. Add it in GitHub: Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          printf 'TELEGRAM_BOT_TOKEN=%s\n' "${TELEGRAM_BOT_TOKEN}" > .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Build and run via Compose
        run: |
          set -euo pipefail
          docker compose up -d --build --remove-orphans

      - name: Cleanup old containers/images
        run: |
          set -euo pipefail
          docker container prune -f
          docker image prune -f
